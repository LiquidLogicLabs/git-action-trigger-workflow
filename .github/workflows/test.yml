name: Test

on:
  workflow_call:  # Called by CI workflow
    secrets:
      NPM_REGISTRY_TOKEN:
        # Declared so a caller can pass it explicitly. Without this declaration GitHub
        # rejects `secrets: {NPM_REGISTRY_TOKEN: ...}` at parse time, which is why
        # `secrets: inherit` was used -- it works without a declaration.
        required: false
  workflow_dispatch:  # Allow manual triggering

concurrency:
  # Explicit prefix (not ${{ github.workflow }}) so this reusable workflow does not
  # share a concurrency group with the caller (ci.yml) — caller/callee on the same
  # group with cancel-in-progress: true triggers GitHub's deadlock detection.
  group: Test-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Always run - this workflow only has workflow_call and workflow_dispatch triggers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # setup-node enables package-manager caching by default; a cache
          # restored from a PR run must not reach a publishing job. Removing
          # `cache: 'npm'` alone is NOT enough -- the default still caches.
          package-manager-cache: false
          registry-url: 'https://git.ravenwolf.org/api/packages/liquidlogiclabs/npm/'
          scope: '@liquidlogiclabs'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Verify Jest is installed
        run: npx jest --version

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:unit

