name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']  # Ignore tag pushes (handled by release workflow)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/.act/**'
      - '.act*'
      - '.github/chatmodes/**'
      - '.github/pull_request_template.md'
      - '.devcontainer.disabled/**'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/.act/**'
      - '.act*'
      - '.github/chatmodes/**'
      - '.github/pull_request_template.md'
      - '.devcontainer.disabled/**'
  workflow_call:  # Allow CI to be called by release workflow (always runs)
    secrets:
      NPM_REGISTRY_TOKEN:
        # Declared so a caller can pass it explicitly. Without this declaration GitHub
        # rejects `secrets: {NPM_REGISTRY_TOKEN: ...}` at parse time, which is why
        # `secrets: inherit` was used -- it works without a declaration.
        required: false
  workflow_dispatch:  # Allow manual triggering (always runs)

concurrency:
  group: ${{ github.workflow || 'CI' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    # No conditions needed - workflow trigger handles filtering
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        # registry-url makes setup-node write the auth .npmrc to RUNNER_TEMP, not the
        # workspace. Never append a token to a workspace .npmrc: act bind-mounts the
        # repo directory and never truncates it, which is how a live token reached a
        # public repo. Auth is supplied per-step via NODE_AUTH_TOKEN.
        #
        # scope is REQUIRED even though git-platform-detector is unscoped. Without it
        # setup-node writes a bare `registry=<gitea>` line, making Gitea the DEFAULT
        # registry; npm then rewrites every public package's resolved URL to that host
        # and `npm ci` dies with 404s. With scope it writes
        # `@liquidlogiclabs:registry=<gitea>` instead, leaving the default registry as
        # npmjs. The private dep is a raw HTTPS tarball, so it needs no scope routing --
        # only the host-scoped `//git.ravenwolf.org/...:_authToken` line, which npm
        # applies to a direct tarball fetch on that host.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # setup-node enables package-manager caching by default; a cache
          # restored from a PR run must not reach a publishing job. Removing
          # `cache: 'npm'` alone is NOT enough -- the default still caches.
          package-manager-cache: false
          registry-url: 'https://git.ravenwolf.org/api/packages/liquidlogiclabs/npm/'
          scope: '@liquidlogiclabs'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        # Non-blocking until Phase 6 reformats. Do not make this blocking here.
        continue-on-error: true
        run: npm run format:check

      - name: Reject duplicate forge workflow directories
        run: |
          # Gitea Actions runs .github/workflows/ — verified against a Gitea-hosted repo in
          # this set that has no .gitea/ directory and whose jobs run there successfully.
          # A second copy is not needed, and the one that existed had drifted badly: it had
          # missed every CI gate added to .github/, and all the defects found in this repo
          # set lived in it, because it is the copy no linter or scanner reads.
          # If a forge genuinely needs its own workflow, get that approved and add the
          # directory to the allowlist below with the reason.
          found=""
          for d in .gitea .forgejo .circleci .drone .woodpecker; do
            [ -e "$d" ] && found="$found $d"
          done
          if [ -n "$found" ]; then
            echo "::error::Duplicate forge workflow directory present:$found"
            echo "::error::.github/workflows/ is the single source for every forge."
            echo "::error::If this is deliberate, record the approved reason and amend this check."
            exit 1
          fi
          echo "No duplicate forge workflow directories."
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # No path: actionlint discovers every workflow itself. Passing a directory makes
          # it fail with "is a directory" and exit 0, having linted nothing -- and passing
          # one file, as this did, left release.yml, test.yml and e2e-tests.yml unchecked,
          # which is where nearly all the shell actually lives.
          args: -color

      - name: Audit workflows for injection and supply-chain issues
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/zizmorcore/zizmor:1.30.0 \
            --no-progress --persona=regular /repo

      - name: Reject a suppressed template-injection finding
        run: |
          # template-injection is the remote-code-execution class this gate exists for. It
          # may never be suppressed -- neither inline nor through a config file that a
          # reviewer scanning workflow diffs would not see.
          if grep -rn 'zizmor: ignore\[template-injection\]' .github action.yml 2>/dev/null; then
            echo "::error::template-injection may not be suppressed; fix it or report blocked"
            exit 1
          fi
          for cfg in .github/zizmor.yml .github/zizmor.yaml zizmor.yml .zizmor.yml; do
            if [ -e "$cfg" ]; then
              echo "::error::$cfg would let findings be silenced outside the workflow diff"
              exit 1
            fi
          done
          echo "No suppressed template-injection findings and no zizmor config."

      - name: Scan for secrets
        run: |
          # Fail loudly if the mount is not a git repo — gitleaks exits 0 in that case.
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh zricethezav/gitleaks:v8.30.1 \
            -c 'test -e /repo/.git' || { echo "::error::gitleaks mount is not a git repo"; exit 1; }
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-banner --redact

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test:
    # No conditions needed - workflow trigger handles filtering
    needs: lint  # Tests run after lint
    # `$/` is GitHub syntax from July 2026 and act 0.2.89 rejects it outright ("must start
    # with './' if it's a local workflow"), which would break every `npm run test:act:*`
    # script here. The marker must sit ON the uses: line -- a comment above a JOB-level
    # uses: is not honoured, unlike the step-level case.
    uses: ./.github/workflows/test.yml  # zizmor: ignore[self-repository]
    secrets:
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    # test.yml runs: unit tests + integration tests (all tests except E2E)
    # Note: E2E tests run in release workflow, not CI


